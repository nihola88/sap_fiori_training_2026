# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: fiori.y2026.sapfioritraining2026
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap/opu/odata/sap/API_SALES_ORDER_SRV
            url: http://10.0.98.20:8017
            client: '050'
          - path: /sap/opu/odata/sap/API_COMPANYCODE_SRV
            url: http://10.0.98.20:8017
            client: '050'
          - path: /sap/opu/odata/sap/API_DIVISION_SRV
            url: http://10.0.98.20:8017
            client: '050'
          - path: /sap/opu/odata/sap/API_PLANT_SRV
            url: http://10.0.98.20:8017
            client: '050'
          - path: /sap/opu/odata/sap/API_SALESORGANIZATION_SRV
            url: http://10.0.98.20:8017
            client: '050'
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
